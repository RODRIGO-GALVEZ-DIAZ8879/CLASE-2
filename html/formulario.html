<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>
    <h1>Uso de Formularios</h1>
    <form action="">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ingrese Nombre"><br><br>

        <label for="Correo">Correo Completo:</label>
        <input type="email" id="correo" placeholder="Ingrese Email"><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" placeholder="Ingresar telefono"><br><br>

        <label for="producto">Producto de Interés:</label>
        <input type="text" id="producto" placeholder="Ingresar producto"><br><br>

        <button type="submit">Enviar</button>
    </form>
</body>


</html>
